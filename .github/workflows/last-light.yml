name: Last Light

on:
  push:
    branches: [main]
    paths: ["last-light/**", ".github/workflows/last-light.yml"]
  pull_request:
    paths: ["last-light/**", ".github/workflows/last-light.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: last-light/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: last-light/server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check the Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist

  game:
    name: Game smoke test and web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -sSfLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSfLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && mv templates/* "$dest/"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Point the game at the island server
        if: vars.LAST_LIGHT_API_URL != ''
        run: sed -i 's|^api/base_url=.*|api/base_url="${{ vars.LAST_LIGHT_API_URL }}"|' last-light/game/project.godot

      - name: Import assets
        run: godot --headless --path last-light/game --import

      - name: Smoke test
        run: |
          godot --headless --path last-light/game --script res://tools/smoke_test.gd 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then exit 1; fi

      - name: Export web build
        run: |
          mkdir -p last-light/build/web
          godot --headless --path last-light/game --export-release "Web" ../build/web/index.html
          test -f last-light/build/web/index.html
          ls -la last-light/build/web

      - uses: actions/upload-artifact@v4
        with:
          name: last-light-web
          path: last-light/build/web

  deploy:
    name: Deploy to Cloudflare
    needs: [server, game]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install server dependencies
        if: steps.creds.outputs.ok == 'true'
        working-directory: last-light/server
        run: npm ci

      - name: Deploy the island server (Worker)
        if: steps.creds.outputs.ok == 'true'
        working-directory: last-light/server
        run: npx wrangler deploy

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: last-light-web
          path: web

      - name: Deploy the game (Cloudflare Pages)
        if: steps.creds.outputs.ok == 'true'
        working-directory: last-light/server
        run: |
          npx wrangler pages project create last-light --production-branch main || true
          npx wrangler pages deploy "$GITHUB_WORKSPACE/web" --project-name last-light --branch main
