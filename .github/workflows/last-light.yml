name: Islander

on:
  push:
    branches: [main]
    paths: ["last-light/**", ".github/workflows/last-light.yml"]
  pull_request:
    paths: ["last-light/**", ".github/workflows/last-light.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

# A new push to the same branch cancels the run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: last-light/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: last-light/server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check the Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist

  game:
    name: Game smoke test and web export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -sSfL --retry 3 --connect-timeout 20 --max-time 300 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSfL --retry 3 --connect-timeout 20 --max-time 300 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && mv templates/* "$dest/"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Point the game at the island server
        if: vars.LAST_LIGHT_API_URL != ''
        run: sed -i 's|^api/base_url=.*|api/base_url="${{ vars.LAST_LIGHT_API_URL }}"|' last-light/game/project.godot

      - name: Import assets
        run: timeout 300 godot --headless --path last-light/game --import

      - name: Smoke test
        run: |
          set -o pipefail  # fail when Godot fails, not just when tee does
          timeout 300 godot --headless --path last-light/game --script res://tools/smoke_test.gd 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|  FAIL " smoke.log; then exit 1; fi

      - name: Export web build
        run: |
          mkdir -p last-light/build/web
          timeout 300 godot --headless --path last-light/game --export-release "Web" ../build/web/index.html
          test -f last-light/build/web/index.html
          # Cloudflare Pages rejects files over 25 MiB, and index.wasm is ~42 MiB.
          # Ship it gzipped; web/wasm-gz.js unpacks it in the browser.
          gzip -9 -n last-light/build/web/index.wasm
          cp last-light/web/wasm-gz.js last-light/build/web/
          grep -q 'wasm-gz.js' last-light/build/web/index.html
          ls -la last-light/build/web
          if find last-light/build/web -type f -size +25M | grep .; then
            echo "::error::A file is over Cloudflare Pages' 25 MiB limit"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: last-light-web
          path: last-light/build/web

  screenshots:
    name: Screenshots
    # Renders the real game (software OpenGL under a virtual display) so changes to
    # the visuals can be checked. Images go to the ci/last-light-screenshots branch
    # and to a workflow artifact. Never blocks a merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -sSfL --retry 3 --connect-timeout 20 --max-time 300 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 > /dev/null

      - name: Import assets
        run: timeout 300 godot --headless --path last-light/game --import

      - name: Render screenshots
        env:
          SHOT_DIR: ${{ github.workspace }}/shots
        run: |
          timeout 1380 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path last-light/game --rendering-driver opengl3 --resolution 1280x720 \
            --script res://tools/screenshot.gd 2>&1 | tee shots.log
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: last-light-screenshots
          path: shots

      - name: Publish to the ci/last-light-screenshots branch
        run: |
          cd shots
          git init -q -b ci/last-light-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Screenshots of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.md
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/last-light-screenshots

  deploy:
    name: Deploy to Cloudflare
    needs: [server, game]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install server dependencies
        if: steps.creds.outputs.ok == 'true'
        working-directory: last-light/server
        run: npm ci

      - name: Deploy the island server (Worker)
        if: steps.creds.outputs.ok == 'true'
        working-directory: last-light/server
        run: npx wrangler deploy

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: last-light-web
          path: web

      - name: Deploy the game (Cloudflare Pages)
        if: steps.creds.outputs.ok == 'true'
        working-directory: last-light/server
        run: |
          npx wrangler pages project create last-light --production-branch main || true
          npx wrangler pages deploy "$GITHUB_WORKSPACE/web" --project-name last-light --branch main --commit-dirty=true
